server.port=${PORT:8000}
server.address=0.0.0.0

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:bobrdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

jwt.secret=${JWT_SECRET:super_secret_forest_key_change_in_prod_12345678901234567890}
jwt.expiration=604800000

qwen.api.key=${QWEN_API_KEY:}
qwen.api.url=${QWEN_API_URL:https://openrouter.ai/api/v1/chat/completions}
qwen.model.name=${QWEN_MODEL:qwen/qwen-2.5-72b-instruct:free}

proxy.enabled=${PROXY_ENABLED:false}
proxy.host=${PROXY_HOST:10.25.24.1}
proxy.port=${PROXY_PORT:1080}

ai.mock.enabled=${AI_MOCK_ENABLED:true}
mail.username=${MAIL_USERNAME:}
mail.password=${MAIL_PASSWORD:}
mail.host=${MAIL_HOST:smtp.gmail.com}
mail.port=${MAIL_PORT:587}
