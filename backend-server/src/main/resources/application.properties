# --- Server ---
server.port=8000

# --- Database (H2 for local dev, no installation needed) ---
spring.datasource.url=jdbc:h2:mem:bobrdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update

# --- JWT Secret ---
jwt.secret=super_secret_forest_key_change_in_prod_12345678901234567890
jwt.expiration=604800000

# --- Qwen AI ---
qwen.api.key=${QWEN_API_KEY:your_qwen_api_key_here}
qwen.api.url=https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
